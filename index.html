<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Картограф — редактор живых карт для D&amp;D</title>
<style>
:root{--bg:#F9F8F7;--panel:#FFFFFF;--surface:#F0EFED;--border:#E6E5E3;--text:#2C2C2B;--muted:#7D7A75;--accent:#2783DE;--accent-soft:#E5F2FC;--danger:#E56458;--danger-soft:#FCE9E7}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--panel:#202020;--surface:#383836;--border:rgba(255,255,255,.2);--text:#FFFFFF;--muted:rgba(255,255,255,.65);--accent:#5E9FE8;--accent-soft:rgba(94,159,232,.16);--danger:#E97366;--danger-soft:rgba(233,115,102,.14)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:60px minmax(0,1fr) 264px;grid-template-rows:52px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel);min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0;white-space:nowrap}
.brand b{font-size:16px}
.brand span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer;white-space:nowrap;justify-content:center}
.hbtn:hover{background:var(--surface)}
.hbtn:disabled{opacity:.4;cursor:default}
.hbtn svg{width:18px;height:18px;flex:none}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sep{width:1px;height:24px;background:var(--border);margin:0 2px}
#tools{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto;scrollbar-width:none}
.tool{width:44px;height:44px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none}
.tool:hover{background:var(--surface)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool svg{width:22px;height:22px}
.tgap{width:28px;height:1px;background:var(--border);margin:5px 0;flex:none}
#stage{position:relative;overflow:hidden;background:#7f8d57;min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:12px;bottom:12px;max-width:min(540px,calc(100% - 150px));background:rgba(28,28,26,.84);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;pointer-events:none}
#hint b{font-weight:600}
#zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
#zoom button{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.94);color:#2C2C2B;cursor:pointer;font-size:16px}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff;color:#2C2C2B;border:1px solid #E6E5E3;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.06);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#panel{background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:16px}
#panel h3{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
#panel section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border)}
#panel section:last-child{border-bottom:0;margin-bottom:0}
.ptitle{font-size:15px;font-weight:600;margin:0 0 4px}
.pdesc{color:var(--muted);font-size:13px;margin:0 0 12px}
.field{margin:0 0 12px}
.field>label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.field label output{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text]{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:0 10px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:34px;border:0;background:transparent;cursor:pointer;font-size:13px;padding:0 4px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{min-height:40px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer;font-size:12px;padding:4px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip i{display:block;width:18px;height:18px;border-radius:4px;margin:0 auto 2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.on{border-color:var(--accent)}
.pbtn{width:100%;min-height:36px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer;margin-top:8px}
.pbtn:hover{background:var(--surface)}
.pbtn.danger{color:var(--danger)}
.pbtn.danger:hover{background:var(--danger-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .pbtn{margin-top:0}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-height:32px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.rules li{margin-bottom:4px}
.kbd{color:var(--muted);font-size:12px;margin-top:8px}
#panelToggle{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){
 #app{grid-template-columns:56px minmax(0,1fr)}
 #panel{position:absolute;right:0;top:52px;bottom:0;width:min(300px,86vw);z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none}
 #panel.open{display:block}
 #panelToggle{display:inline-flex}
 .hbtn .lbl{display:none}
 .brand span{display:none}
 #tools{width:56px}
}
@media (max-width:480px){.hide-xs{display:none!important}#hint{font-size:12px;max-width:calc(100% - 24px);bottom:56px}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="brand"><b>Картограф</b><span>редактор живых карт для D&amp;D</span></div>
  <button class="hbtn" id="undo" title="Отменить (⌘Z)" aria-label="Отменить"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a4.5 4.5 0 010 9h-2"/></svg></button>
  <button class="hbtn" id="redo" title="Повторить (⇧⌘Z)" aria-label="Повторить"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l4 4-4 4"/><path d="M17 9H8a4.5 4.5 0 000 9h2"/></svg></button>
  <span class="sep"></span>
  <button class="hbtn" id="nightBtn" title="День / ночь (N)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z"/></svg><span class="lbl">Ночь</span></button>
  <button class="hbtn hide-xs" id="saveJson" title="Сохранить карту в файл"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg><span class="lbl">Сохранить</span></button>
  <button class="hbtn hide-xs" id="loadJson" title="Открыть карту из файла"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14V4M6 8l4-4 4 4M4 16h12"/></svg><span class="lbl">Открыть</span></button>
  <button class="hbtn primary" id="exportPng" title="Выгрузить PNG"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 13l4-4 3 3 2-2 5 5"/></svg><span class="lbl">PNG</span></button>
  <button class="hbtn" id="panelToggle" aria-label="Параметры"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
 </header>
 <nav id="tools" aria-label="Инструменты"></nav>
 <main id="stage">
  <canvas id="map" aria-label="Холст карты"></canvas>
  <div id="toast" role="status"></div>
  <div id="hint"></div>
  <div id="zoom"><button id="zOut" aria-label="Отдалить">−</button><button id="zFit" aria-label="Показать всю карту" title="Вся карта"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg></button><button id="zIn" aria-label="Приблизить">+</button></div>
 </main>
 <aside id="panel" aria-label="Параметры"></aside>
</div>
<script>

(()=>{
"use strict";
const W=2000,H=1300,GRID=10;
const $=id=>document.getElementById(id);
const canvas=$('map'),ctx=canvas.getContext('2d');
const mk=(w,h,o)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d',o)]};
const RO={willReadFrequently:true};
const [mH1,mh1]=mk(W,H,RO),[mH2,mh2]=mk(W,H,RO),[mWt,mwt]=mk(W,H,RO);
const [tmpC,tctx]=mk(W,H),[ripC,rctx]=mk(W,H),[layG,gctx]=mk(W,H),[layA,actx]=mk(W,H),[layS,sctx]=mk(W,H);
const LS=.5,[layL,lctx]=mk(W*LS,H*LS);
const [oH1,oh1]=mk(W,H,RO),[oH2,oh2]=mk(W,H,RO),[oWt,owt]=mk(W,H,RO);
const [orgC,orgx]=mk(W,H,RO);
const PAIRS=[[mH1,oH1,oh1,'h1'],[mH2,oH2,oh2,'h2'],[mWt,oWt,owt,'w']];

/* ---------- utils ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function shade(h,f){const c=hex2rgb(h).map(v=>f>=0?v+(255-v)*f:v*(1+f));return'rgb('+c.map(v=>Math.round(clamp(v,0,255))).join(',')+')'}
function chaikin(p,it=3){let a=p;for(let k=0;k<it;k++){if(a.length<3)return a;const b=[a[0]];for(let i=0;i<a.length-1;i++){const[x0,y0]=a[i],[x1,y1]=a[i+1];b.push([x0*.75+x1*.25,y0*.75+y1*.25],[x0*.25+x1*.75,y0*.25+y1*.75])}b.push(a[a.length-1]);a=b}return a}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return dist(px,py,ax+dx*t,ay+dy*t)}
function rdp(p,eps){if(p.length<3)return p;let md=0,mi=0;const a=p[0],b=p[p.length-1];for(let i=1;i<p.length-1;i++){const d=segDist(p[i][0],p[i][1],a[0],a[1],b[0],b[1]);if(d>md){md=d;mi=i}}if(md>eps){const l=rdp(p.slice(0,mi+1),eps),r=rdp(p.slice(mi),eps);return l.slice(0,-1).concat(r)}return[a,b]}
function polyDist(px,py,p){if(p.length===1)return dist(px,py,p[0][0],p[0][1]);let m=1e9;for(let i=0;i<p.length-1;i++)m=Math.min(m,segDist(px,py,p[i][0],p[i][1],p[i+1][0],p[i+1][1]));return m}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function segInter(a,b,c,d){const r=[b[0]-a[0],b[1]-a[1]],s=[d[0]-c[0],d[1]-c[1]],den=r[0]*s[1]-r[1]*s[0];if(Math.abs(den)<1e-9)return null;const t=((c[0]-a[0])*s[1]-(c[1]-a[1])*s[0])/den,u=((c[0]-a[0])*r[1]-(c[1]-a[1])*r[0])/den;return t>=0&&t<=1&&u>=0&&u<=1?[a[0]+t*r[0],a[1]+t*r[1],Math.atan2(r[1],r[0])]:null}
function offsetLine(p,d){return p.map((pt,i)=>{const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)];let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;return[pt[0]+nx/l*d,pt[1]+ny/l*d]})}
function tracePath(c,p,close){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);if(close)c.closePath()}
const sm=o=>o._sm||(o._sm=chaikin(o.pts,3));
const centroid=p=>{let x=0,y=0;for(const q of p){x+=q[0];y+=q[1]}return[x/p.length,y/p.length]};
const rectPts=(cx,cy,w,h,a)=>{const c=Math.cos(a),s=Math.sin(a);return[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y])=>[cx+x*c-y*s,cy+x*s+y*c])};
const ovalPts=(cx,cy,rx,ry)=>Array.from({length:36},(_,i)=>{const a=i/36*Math.PI*2;return[cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]});
const rotPts=(p,a,cx,cy)=>{const c=Math.cos(a),s=Math.sin(a);return p.map(([x,y])=>[cx+(x-cx)*c-(y-cy)*s,cy+(x-cx)*s+(y-cy)*c])};

const NOISE=(()=>{const N=new Float32Array(W*H);for(const[cell,amp,seed]of[[46,.62,5],[14,.3,6],[5,.12,9]]){const r=rng(seed),gw=Math.ceil(W/cell)+2,gh=Math.ceil(H/cell)+2,g=new Float32Array(gw*gh);for(let i=0;i<g.length;i++)g[i]=r()-.5;for(let y=0;y<H;y++){const fy=y/cell,iy=fy|0,ty=fy-iy,sy=ty*ty*(3-2*ty);for(let x=0;x<W;x++){const fx=x/cell,ix=fx|0,tx=fx-ix,sx=tx*tx*(3-2*tx),i0=iy*gw+ix,a=g[i0]+(g[i0+1]-g[i0])*sx,b=g[i0+gw]+(g[i0+gw+1]-g[i0+gw])*sx;N[y*W+x]+=(a+(b-a)*sy)*amp}}}return N})();
function organic(raw,out,octx,key){orgx.clearRect(0,0,W,H);orgx.filter='blur(7px)';orgx.drawImage(raw,0,0);orgx.filter='none';const id=orgx.getImageData(0,0,W,H),d=id.data;for(let i=0,n=W*H;i<n;i++){const a=d[i*4+3];if(a===0){continue}const v=(a+NOISE[i]*150-128)*3+128;d[i*4]=d[i*4+1]=d[i*4+2]=0;d[i*4+3]=v<0?0:v>255?255:v}octx.putImageData(id,0,0);alpha[key]=d}
function organicAll(){for(const[r,o,c,k]of PAIRS)organic(r,o,c,k)}
function liveCopy(){for(const[r,o,c,k]of PAIRS){c.clearRect(0,0,W,H);c.drawImage(r,0,0);alpha[k]=null}}
/* ---------- textures ---------- */
function makePattern(size,base,specks,seed,extra){const[c,x]=mk(size,size);const r=rng(seed);x.fillStyle=base;x.fillRect(0,0,size,size);if(extra)extra(x,r,size);for(const[col,n,sz]of specks){x.fillStyle=col;x.strokeStyle=col;for(let i=0;i<n;i++){const px=r()*size,py=r()*size;if(sz<0){x.lineWidth=1;x.beginPath();x.moveTo(px,py);x.lineTo(px+(r()-.5)*3,py-3-r()*3);x.stroke()}else{x.globalAlpha=.6;x.beginPath();x.arc(px,py,sz*(.5+r()),0,7);x.fill();x.globalAlpha=1}}}return ctx.createPattern(c,'repeat')}
function cobbles(x,r,s){for(let yy=0;yy<s;yy+=11)for(let xx=(yy/11%2)*6;xx<s+11;xx+=12){const g=r()*30|0;x.fillStyle=`rgb(${148+g},${142+g},${132+g})`;x.beginPath();x.ellipse(xx,yy,5.4,4.6,r(),0,7);x.fill();x.strokeStyle='rgba(60,55,48,.45)';x.lineWidth=1;x.stroke()}}
function planks(x,r,s){for(let yy=0;yy<s;yy+=8){x.fillStyle=`rgb(${150+r()*20|0},${108+r()*16|0},${66+r()*12|0})`;x.fillRect(0,yy,s,7);x.fillStyle='rgba(70,45,22,.5)';x.fillRect(0,yy+7,s,1);x.fillRect((r()*s)|0,yy,1,7)}}
const MATS={
 grass:{n:'Трава',c:'#b6c47f',p:makePattern(256,'#b6c47f',[['#a8b872',260,2.2],['#c4d08f',200,1.8],['#9aad66',140,-1],['#cfd99d',60,1.2]],7)},
 meadow:{n:'Луг',c:'#9fb465',p:makePattern(256,'#9fb465',[['#8fa658',260,2.4],['#b2c675',160,1.6],['#7e9a4c',220,-1],['#e9e4a6',24,1],['#e8b6c8',14,1]],8)},
 dirt:{n:'Земля',c:'#ae8f61',p:makePattern(256,'#ae8f61',[['#9c7f53',260,2.2],['#c0a273',200,1.8],['#8c7048',90,1.2]],9)},
 sand:{n:'Песок',c:'#dcc993',p:makePattern(256,'#dcc993',[['#ccb880',260,1.6],['#e8d8a8',220,1.4],['#bfa970',60,1]],10)},
 stone:{n:'Брусчатка',c:'#9e978b',p:makePattern(128,'#8a847a',[],12,cobbles)},
 wood:{n:'Доски',c:'#9a6c42',p:makePattern(128,'#9a6c42',[],14,planks)},
 field:{n:'Поле',c:'#c9b45e',p:makePattern(128,'#c4b05a',[['#d8c66f',120,1.2]],16,(x,r,s)=>{for(let y=0;y<s;y+=8){x.fillStyle='#a8953f';x.fillRect(0,y,s,3);x.fillStyle='#d9c873';x.fillRect(0,y+4,s,2)}})},
 crops:{n:'Грядки',c:'#7f9a45',p:makePattern(128,'#8d6f47',[],17,(x,r,s)=>{for(let y=0;y<s;y+=10){x.fillStyle='#6f8f3a';for(let xx=2;xx<s;xx+=6){x.beginPath();x.arc(xx+r()*2,y+5,2.6+r(),0,7);x.fill()}}})},
 snow:{n:'Снег',c:'#eef1f1',p:makePattern(256,'#eef1f1',[['#dfe6ea',200,2.2],['#ffffff',160,1.6]],15)}};
const hillPat=makePattern(256,'#a2b96a',[['#94ac5e',220,2],['#b3c97c',180,1.6],['#86a055',120,-1]],11);
const plateauPat=makePattern(256,'#98ae63',[['#8aa257',220,2],['#a9bf74',160,1.6],['#7f9a52',140,-1],['#a39d8c',40,1.6]],13);
const ripPat=(()=>{const[c,x]=mk(160,160);const r=rng(3);x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=1.3;x.lineCap='round';for(let i=0;i<34;i++){const px=r()*160,py=r()*160,l=6+r()*12;x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+l/2,py-2,px+l,py);x.stroke()}return ctx.createPattern(c,'repeat')})();

/* ---------- state ---------- */
const COLORS=['#b4553f','#8d5a3b','#c9a14a','#5f6f8a','#6d8a4a','#7a4a6e','#4f7d86','#d9d0bd'];
const BANKS={grass:['#5f7f3c','Трава'],sand:['#dcc68f','Песок'],stone:['#9b958b','Камень']};
const STAMPS={
 rock:{n:'Камень',r:10,h:4},bush:{n:'Куст',r:9,h:5},campfire:{n:'Костёр',r:12,h:0,light:[175,'255,150,60']},

const opts={hillR:60,hillLvl:1,waterR:50,groundR:40,mat:'dirt',riverW:26,bank:'grass',roadW:14,bH:18,bColor:'#b4553f',wallT:10,wallH:14,treeR:13,forestR:70,eraseR:24,stamp:'campfire',stampS:1};

const replacer=(k,v)=>k[0]==='_'?undefined:v;

let hist=[],redoS=[],prev=null,booting=true;
function commit(){const cur=snap();if(cur===prev)return;hist.push(prev);if(hist.length>80)hist.shift();prev=cur;redoS=[];persist(cur);updUndo()}
const LISTS=['rivers','roads','buildings','walls','trees','stamps','labels','districts','partitions'];

function strokeOp(c,op,from,mode){c.globalCompositeOperation=mode;c.fillStyle=c.strokeStyle='#000';c.lineCap=c.lineJoin='round';c.lineWidth=op.r*2;const p=op.pts;if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],op.r,0,7);c.fill()}else{c.beginPath();c.moveTo(p[from][0],p[from][1]);for(let i=from+1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.stroke()}c.globalCompositeOperation='source-over'}
function applyHillOp(op,from=0){if(op.m==='add')strokeOp(op.l===2?mh2:mh1,op,from,'source-over');else{strokeOp(mh2,op,from,'destination-out');if(op.l!==2)strokeOp(mh1,op,from,'destination-out')}alpha.h1=alpha.h2=null}

function applyGroundOp(op,from=0){const p=op.pts;gctx.filter='blur(2.5px)';gctx.strokeStyle=gctx.fillStyle=(MATS[op.mat]||MATS.grass).p;gctx.lineCap=gctx.lineJoin='round';gctx.lineWidth=op.r*2;if(p.length===1){gctx.beginPath();gctx.arc(p[0][0],p[0][1],op.r,0,7);gctx.fill()}else{gctx.beginPath();gctx.moveTo(p[from][0],p[from][1]);for(let i=from+1;i<p.length;i++)gctx.lineTo(p[i][0],p[i][1]);gctx.stroke()}gctx.filter='none'}
function rebuildMasks(){for(const c of[mh1,mh2,mwt])c.clearRect(0,0,W,H);for(const op of state.hillOps)applyHillOp(op);for(const op of state.waterOps)applyWaterOp(op);alpha={};organicAll()}
function rebuildGround(){gctx.fillStyle=MATS.grass.p;gctx.fillRect(0,0,W,H);for(const op of state.groundOps)applyGroundOp(op)}
function sample(key,c,x,y){if(!alpha[key])alpha[key]=c.getImageData(0,0,W,H).data;x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return false;return alpha[key][(y*W+x)*4+3]>127}
const heightAt=(x,y)=>(sample('h1',oh1,x,y)?1:0)+(sample('h2',oh2,x,y)?1:0);

function tintFrom(src,fill,blur){tctx.clearRect(0,0,W,H);tctx.filter=blur?`blur(${blur}px)`:'none';tctx.drawImage(src,0,0);tctx.filter='none';tctx.globalCompositeOperation='source-in';tctx.fillStyle=fill;tctx.fillRect(0,0,W,H);tctx.globalCompositeOperation='source-over'}

function drawLevel(src,top,s,k){tintFrom(src,'#26301a',6);actx.globalAlpha=.3;actx.drawImage(tmpC,s.x*22*k,s.y*22*k);actx.globalAlpha=1;tintFrom(src,'#6a5538');actx.drawImage(tmpC,s.x*10*k,s.y*10*k);tintFrom(src,'#866c48');actx.drawImage(tmpC,s.x*5*k,s.y*5*k);tintFrom(src,'#d2df9f');actx.drawImage(tmpC,-s.x*2.5,-s.y*2.5);tintFrom(src,top);actx.drawImage(tmpC,0,0)}
function renderA(){const s=shadowVec();actx.drawImage(layG,0,0);

/* ---------- derived: bridges, waterfalls, stairs ---------- */
function walk(p,step,fn){for(let i=0;i<p.length-1;i++){const[x0,y0]=p[i],[x1,y1]=p[i+1];const L=dist(x0,y0,x1,y1),n=Math.max(1,Math.ceil(L/step)),ang=Math.atan2(y1-y0,x1-x0);for(let k=0;k<n;k++)fn(x0+(x1-x0)*k/n,y0+(y1-y0)*k/n,ang)}}
function recomputeDerived(){const oB=derived.bridges.length,oF=derived.falls.length,oS=derived.stairs.length;const bridges=[],falls=[],stairs=[];
 for(const rd of state.roads){const a=sm(rd);for(const rv of state.rivers){const b=sm(rv);for(let i=0;i<a.length-1;i++)for(let j=0;j<b.length-1;j++){const h=segInter(a[i],a[i+1],b[j],b[j+1]);if(h&&!bridges.some(o=>dist(o.x,o.y,h[0],h[1])<rv.w*1.2)){const rang=Math.atan2(b[j+1][1]-b[j][1],b[j+1][0]-b[j][0]);const cross=Math.abs(Math.sin(h[2]-rang));bridges.push({x:h[0],y:h[1],ang:h[2],len:rv.w/Math.max(cross,.4)+26,wd:rd.w+8,stone:rv.w>40})}}}
  let ph=null;walk(a,3,(x,y,ang)=>{const h=heightAt(x,y);if(ph!==null&&h!==ph&&!stairs.some(o=>dist(o.x,o.y,x,y)<rd.w*1.5)&&!isWater(x,y))stairs.push({x,y,ang:h>ph?ang:ang+Math.PI,w:rd.w});ph=h})}
 for(const rv of state.rivers){let ph=null;walk(sm(rv),3,(x,y,ang)=>{const h=heightAt(x,y);if(ph!==null&&h!==ph&&!falls.some(f=>dist(f.x,f.y,x,y)<rv.w*1.2))falls.push({x,y,ang:h<ph?ang:ang+Math.PI,w:rv.w});ph=h})}
 derived={bridges,falls,stairs};
 if(!booting){if(bridges.length>oB)toast('Мост построен автоматически');else if(falls.length>oF)toast('Появился водопад');else if(stairs.length>oS)toast('На склоне появились ступени')}}

 for(const st of state.stamps){const d=STAMPS[st.type];if(st.floor&&!(state.roofMode==='interior'&&st.floor===state.level))continue;if(!d||!d.h)continue;const r=d.r*st.s;sctx.beginPath();sctx.ellipse(st.x+SV.x*d.h*st.s,st.y+SV.y*d.h*st.s,r,r*.9,0,0,7);sctx.fill()}
 for(const b of derived.bridges){sctx.save();sctx.translate(b.x+SV.x*6,b.y+SV.y*6);sctx.rotate(b.ang);sctx.fillRect(-b.len/2,-b.wd/2,b.len,b.wd);sctx.restore()}}

function drawRoad(c,r){const p=sm(r);if(p.length<2)return;c.lineCap=c.lineJoin='round';tracePath(c,p);c.strokeStyle='rgba(110,82,50,.5)';c.lineWidth=r.w+6;c.stroke();c.strokeStyle=r.paved?'#a39c90':'#cdab74';c.lineWidth=r.w;c.stroke();c.strokeStyle=r.paved?'#b7b0a3':'#dcc08f';c.lineWidth=r.w*.45;c.stroke();if(r.paved){c.setLineDash([4,3]);c.lineWidth=r.w*.8;c.strokeStyle='rgba(80,74,66,.35)';for(const k of[0]){tracePath(c,p);c.stroke()}}else{c.setLineDash([1.5,10]);c.lineWidth=2.6;c.strokeStyle='#a88758';for(const k of[-.28,.28]){tracePath(c,offsetLine(p,r.w*k));c.stroke()}}c.setLineDash([])}

function drawBridge(c,b){c.save();c.translate(b.x,b.y);c.rotate(b.ang);const L=b.len,w=b.wd;if(b.stone){c.fillStyle='#9e978b';c.fillRect(-L/2,-w/2-3,L,w+6);c.fillStyle='#b7b0a3';c.fillRect(-L/2,-w/2,L,w);c.strokeStyle='rgba(70,65,58,.4)';c.lineWidth=1;for(let x=-L/2+4;x<L/2;x+=7){c.beginPath();c.moveTo(x,-w/2);c.lineTo(x,w/2);c.stroke()}c.strokeStyle='#5e584f';c.lineWidth=1.4;c.strokeRect(-L/2,-w/2-3,L,w+6)}else{c.fillStyle='#9a6b3d';c.fillRect(-L/2,-w/2,L,w);c.strokeStyle='#76502c';c.lineWidth=1;for(let x=-L/2+3;x<L/2;x+=4.5){c.beginPath();c.moveTo(x,-w/2);c.lineTo(x,w/2);c.stroke()}c.fillStyle='#5b3a1e';c.fillRect(-L/2,-w/2-2,L,3);c.fillRect(-L/2,w/2-1,L,3);for(const x of[-L/2,L/2-4])for(const y of[-w/2-3,w/2-2])c.fillRect(x,y,4,5)}c.restore()}
function drawFall(c,f,t){c.save();c.translate(f.x,f.y);c.rotate(f.ang);const w=f.w;c.fillStyle='rgba(235,248,255,.8)';c.fillRect(-3,-w/2,12,w);c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=1.4;c.setLineDash([3,4]);for(let i=-w/2+2;i<w/2-1;i+=3){c.lineDashOffset=-((t*50+i*5)%7);c.beginPath();c.moveTo(-3,i);c.lineTo(10,i);c.stroke()}c.setLineDash([]);c.fillStyle='#fff';for(let k=0;k<10;k++){const a=Math.abs((t*1.2+k*.37)%1);c.globalAlpha=(1-a)*.85;c.beginPath();c.arc(12+a*13,((k*.61)%1-.5)*w*.9,1.5+a*4.5,0,7);c.fill()}c.globalAlpha=1;c.restore()}
function drawStairs(c,s){c.save();c.translate(s.x,s.y);c.rotate(s.ang);const w=s.w+4;c.fillStyle='#bdb3a0';c.fillRect(-9,-w/2,18,w);c.strokeStyle='#6f6656';c.lineWidth=1.2;for(let x=-8;x<=8;x+=3.2){c.beginPath();c.moveTo(x,-w/2);c.lineTo(x,w/2);c.stroke()}c.restore()}
function drawBuilding(c,b){const lx=-SV.x,ly=-SV.y,col=b.color,p=b.pts;
 if(b.kind==='house'&&p.length===4){let[q0,q1,q2,q3]=p;if(dist(...q0,...q1)<dist(...q1,...q2))[q0,q1,q2,q3]=[q1,q2,q3,q0];const ux=q1[0]-q0[0],uy=q1[1]-q0[1],L=Math.hypot(ux,uy),sw=dist(...q1,...q2),ins=Math.min(sw/2,L/2-1)/L;const m0=[(q0[0]+q3[0])/2,(q0[1]+q3[1])/2],m1=[(q1[0]+q2[0])/2,(q1[1]+q2[1])/2];const r0=[m0[0]+ux*ins,m0[1]+uy*ins],r1=[m1[0]-ux*ins,m1[1]-uy*ins];const rc=[(r0[0]+r1[0])/2,(r0[1]+r1[1])/2];
  for(const f of[[q0,q1,r1,r0],[q1,q2,r1],[q2,q3,r0,r1],[q3,q0,r0]]){const ex=(f[0][0]+f[1][0])/2-rc[0],ey=(f[0][1]+f[1][1])/2-rc[1],l=Math.hypot(ex,ey)||1,d=(ex*lx+ey*ly)/l;tracePath(c,f,true);c.fillStyle=shade(col,d*.3);c.fill();c.strokeStyle=c.fillStyle;c.lineWidth=.5;c.stroke()}
  c.save();tracePath(c,p,true);c.clip();c.strokeStyle='rgba(0,0,0,.13)';c.lineWidth=1;const n=Math.floor(L/4.5);for(let i=1;i<n;i++){const t=i/n;c.beginPath();c.moveTo(q0[0]+ux*t,q0[1]+uy*t);c.lineTo(q3[0]+ux*t,q3[1]+uy*t);c.stroke()}c.restore();
  c.strokeStyle=shade(col,-.45);c.lineWidth=1.3;c.beginPath();c.moveTo(...r0);c.lineTo(...r1);for(const[q,r]of[[q0,r0],[q3,r0],[q1,r1],[q2,r1]]){c.moveTo(...q);c.lineTo(...r)}c.stroke();
  if(b.chimney!==false){const cx=r1[0]*.7+r0[0]*.3+(q2[0]-q1[0])*.18,cy=r1[1]*.7+r0[1]*.3+(q2[1]-q1[1])*.18;c.fillStyle='#6b625a';c.fillRect(cx-2.5,cy-2.5,5,5);c.fillStyle='#2b2724';c.fillRect(cx-1.2,cy-1.2,2.4,2.4)}}
 else if(b.kind==='tower'){const[cx,cy]=centroid(p);for(let i=0;i<p.length;i++){const a=p[i],q=p[(i+1)%p.length],ex=(a[0]+q[0])/2-cx,ey=(a[1]+q[1])/2-cy,l=Math.hypot(ex,ey)||1,d=(ex*lx+ey*ly)/l;c.beginPath();c.moveTo(cx,cy);c.lineTo(...a);c.lineTo(...q);c.closePath();c.fillStyle=shade(col,d*.34);c.fill();c.strokeStyle=c.fillStyle;c.lineWidth=.6;c.stroke()}c.strokeStyle='rgba(0,0,0,.12)';c.lineWidth=1;const R=dist(cx,cy,...p[0]);for(let r=R*.25;r<R;r+=4){c.beginPath();c.arc(cx,cy,r,0,7);c.stroke()}c.fillStyle=shade(col,-.5);c.beginPath();c.arc(cx,cy,2.2,0,7);c.fill()}
 else{tracePath(c,p,true);c.fillStyle=col;c.fill();c.save();tracePath(c,p,true);c.clip();c.lineWidth=7;c.strokeStyle=shade(col,.25);c.translate(lx*3,ly*3);tracePath(c,p,true);c.stroke();c.translate(-lx*6,-ly*6);c.strokeStyle=shade(col,-.3);tracePath(c,p,true);c.stroke();c.restore();c.save();tracePath(c,p,true);c.clip();c.strokeStyle='rgba(0,0,0,.1)';c.lineWidth=1;let a=1e9,bq=1e9,e=-1e9,f=-1e9;for(const q of p){a=Math.min(a,q[0]);bq=Math.min(bq,q[1]);e=Math.max(e,q[0]);f=Math.max(f,q[1])}for(let y=bq;y<f;y+=5){c.beginPath();c.moveTo(a,y);c.lineTo(e,y);c.stroke()}c.restore()}
 tracePath(c,p,true);c.strokeStyle='rgba(45,32,22,.85)';c.lineWidth=1.4;c.stroke()}
function drawWall(c,w){const p=sm(w);if(p.length<2)return;c.lineCap='square';c.lineJoin='round';tracePath(c,p);c.strokeStyle='#4a443c';c.lineWidth=w.t+3;c.stroke();c.strokeStyle=w.color||'#b8b0a2';c.lineWidth=w.t;c.stroke();c.strokeStyle='#ece7dc';c.lineWidth=w.t*.45;c.setLineDash([4,4]);tracePath(c,offsetLine(p,-w.t*.24));c.stroke();c.strokeStyle='#5a544b';c.lineWidth=1;c.setLineDash([]);tracePath(c,offsetLine(p,-w.t*.02));c.stroke();c.setLineDash([]);c.strokeStyle='rgba(60,55,48,.35)';c.lineWidth=1;tracePath(c,offsetLine(p,w.t*.18));c.stroke()}
const TREECOL=['#4d7838','#5a8840','#3f6a34','#66914a','#6e8a3a'];
function drawTree(c,t,time){const r=rng(t.v),base=t.autumn?['#b86a2c','#c99434','#a5532b'][t.v%3]:TREECOL[t.v%5],sw=Math.sin(time*1.4+t.v%97)*.8,blobs=[];const n=5;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+r()*.6,d=t.r*.42;blobs.push([t.x+Math.cos(a)*d,t.y+Math.sin(a)*d,t.r*(.5+r()*.15)])}blobs.push([t.x,t.y,t.r*.6]);

function drawLabel(c,l){c.save();c.font=`italic 600 ${l.size}px Georgia,"Times New Roman",serif`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.strokeStyle='rgba(250,245,228,.92)';c.lineWidth=l.size*.24;c.strokeText(l.text,l.x,l.y);c.fillStyle='#2b2418';c.fillText(l.text,l.x,l.y);c.restore()}
function drawGrid(c){const G=gridPixels();c.strokeStyle='rgba(30,30,20,.18)';c.lineWidth=.6;c.beginPath();for(let x=0;x<=W;x+=G){c.moveTo(x,0);c.lineTo(x,H)}for(let y=0;y<=H;y+=G){c.moveTo(0,y);c.lineTo(W,y)}c.stroke()}
function lightSources(t){const L=[];for(const st of state.stamps){const d=STAMPS[st.type];if(d&&d.light){const f=1+Math.sin(t*11+st.v)*.05+Math.sin(t*5.3+st.v*.7)*.04;L.push({x:st.x,y:st.y,r:d.light[0]*st.s*f,col:d.light[1],k:1})}}for(const b of state.buildings){if(b.kind==='tower'||b.lit===false||(state.roofMode==='interior'&&state.level>(b.floors||1)))continue;const[cx,cy]=centroid(b.pts);L.push({x:cx,y:cy,r:52+b.h,col:'255,190,110',k:.55})}return L}
function drawNight(c,t){const n=state.night;if(n<=0)return;const L=lightSources(t);lctx.setTransform(LS,0,0,LS,0,0);lctx.globalCompositeOperation='source-over';lctx.clearRect(0,0,W,H);lctx.fillStyle=`rgba(10,18,46,${.74*n})`;lctx.fillRect(0,0,W,H);lctx.globalCompositeOperation='destination-out';for(const l of L){const g=lctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);g.addColorStop(0,`rgba(0,0,0,${.95*l.k})`);g.addColorStop(.5,`rgba(0,0,0,${.6*l.k})`);g.addColorStop(1,'rgba(0,0,0,0)');lctx.fillStyle=g;lctx.beginPath();lctx.arc(l.x,l.y,l.r,0,7);lctx.fill()}lctx.globalCompositeOperation='source-over';c.drawImage(layL,0,0,W,H);c.save();c.globalCompositeOperation='lighter';for(const l of L){const g=c.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r*.75);g.addColorStop(0,`rgba(${l.col},${.2*n*l.k})`);g.addColorStop(1,`rgba(${l.col},0)`);c.fillStyle=g;c.beginPath();c.arc(l.x,l.y,l.r*.75,0,7);c.fill()}c.restore()}
function drawWorld(c,t,overlay){
 if(dirty.mask){rebuildMasks();dirty.mask=false;dirty.A=dirty.der=true}
 if(dirty.ground){rebuildGround();dirty.ground=false;dirty.A=true}
 if(dirty.der){recomputeDerived();dirty.der=false;dirty.S=true}
 if(dirty.A){renderA();dirty.A=false}
 if(dirty.S){renderS();dirty.S=false}
 c.drawImage(layA,0,0);
 if(state.waterOps.length){rctx.globalCompositeOperation='source-over';rctx.clearRect(0,0,W,H);rctx.save();rctx.translate((t*9)%160,(t*4)%160);rctx.fillStyle=ripPat;rctx.fillRect(-160,-160,W+320,H+320);rctx.restore();rctx.globalCompositeOperation='destination-in';rctx.filter='blur(3px)';rctx.drawImage(oWt,0,0);rctx.filter='none';rctx.globalCompositeOperation='source-over';c.globalAlpha=.5+.15*Math.sin(t*1.7);c.drawImage(ripC,0,0);c.globalAlpha=1}
 for(const r of state.roads)drawRoad(c,r);
 for(const s of derived.stairs)drawStairs(c,s);
 for(const r of state.rivers)drawRiver(c,r,t);
 for(const f of derived.falls)drawFall(c,f,t);
 c.globalAlpha=.3;c.drawImage(layS,0,0);c.globalAlpha=1;
 for(const b of derived.bridges)drawBridge(c,b);
 for(const st of state.stamps)if(st.type==='boat'||st.type==='rock')drawStamp(c,st,t);
 for(const w of state.walls)drawWall(c,w);
 for(const b of state.buildings)drawBuilding(c,b);
 for(const st of state.stamps)if(st.type!=='boat'&&st.type!=='rock')drawStamp(c,st,t);
 for(const tr of state.trees)drawTree(c,tr,t);
 drawNight(c,t);
 if(state.grid)drawGrid(c);
 for(const l of state.labels)drawLabel(c,l);
 if(overlay)drawOverlay(c)}

/* ---------- view ---------- */
let view={s:1,x:0,y:0},dpr=1,cw=0,ch=0;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);cw=r.width;ch=r.height;canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr)}
function fit(){const s=Math.min(cw/W,ch/H)*.96;view={s,x:(cw-W*s)/2,y:(ch-H*s)/2}}
function zoomAt(f,sx,sy){const ns=clamp(view.s*f,.15,6);const wx=(sx-view.x)/view.s,wy=(sy-view.y)/view.s;view.s=ns;view.x=sx-wx*ns;view.y=sy-wy*ns}
const toWorld=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left-view.x)/view.s,(e.clientY-r.top-view.y)/view.s]};

function renderTools(){$('tools').innerHTML=TOOLS.map(t=>t==='-'?'<div class="tgap"></div>':`<button class="tool${tool===t.id?' on':''}" data-t="${t.id}" title="${t.n} (${t.k.toUpperCase()})" aria-label="${t.n}" aria-pressed="${tool===t.id}">${t.i}</button>`).join('')}
$('tools').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)setTool(b.dataset.t)});
function setTool(t){tool=t;if(t!=='select')sel=null;renderTools();renderPanel();updHint()}
function updHint(){const t=TOOLS.find(x=>x.id===tool);$('hint').innerHTML=`<b>${t.n}.</b> ${t.h}`}

/* ---------- panel ---------- */
const field=(id,label,min,max,val,step=1,unit='')=>`<div class="field"><label for="${id}">${label}<output id="${id}-o">${val}${unit}</output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit}"></div>`;
const swatches=(cur,act,label='Цвет крыши')=>`<div class="field"><label>${label}</label><div class="swatches">${COLORS.map(c=>`<button class="sw${c===cur?' on':''}" style="background:${c}" data-${act}="${c}" aria-label="Цвет ${c}"></button>`).join('')}</div></div>`;
const seg=(label,items,cur,act)=>`<div class="field"><label>${label}</label><div class="seg">${items.map(([k,v])=>`<button class="${k===cur?'on':''}" data-${act}="${k}">${v}</button>`).join('')}</div></div>`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function findSel(){if(!sel)return null;return(state[sel.k]||[]).find(o=>o.id===sel.id)||null}
const KN={buildings:'Постройка',rivers:'Река',roads:'Дорога',walls:'Стена',trees:'Дерево',stamps:'Объект',labels:'Подпись'};

  if(sel.k==='buildings')h+=field('sel-h','Высота',2,70,o.h)+field('sel-rot','Поворот',-180,180,o.rot||0,1,'°')+swatches(o.color,'scol')+(o.kind==='house'?`<label class="check"><input type="checkbox" id="sel-chim"${o.chimney!==false?' checked':''}> Печная труба</label>`:'')+`<label class="check"><input type="checkbox" id="sel-lit"${o.lit!==false?' checked':''}> Свет в окнах ночью</label><button class="pbtn" id="paintAll">Покрасить все постройки</button>`;

function hit(x,y){for(let i=state.labels.length-1;i>=0;i--){const l=state.labels[i];if(Math.abs(x-l.x)<l.text.length*l.size*.28+6&&Math.abs(y-l.y)<l.size*.6)return{k:'labels',id:l.id}}
 for(let i=state.trees.length-1;i>=0;i--){const t=state.trees[i];if(dist(x,y,t.x,t.y)<t.r)return{k:'trees',id:t.id}}
 for(let i=state.stamps.length-1;i>=0;i--){const s=state.stamps[i];if(dist(x,y,s.x,s.y)<STAMPS[s.type].r*s.s+2)return{k:'stamps',id:s.id}}
 for(let i=state.buildings.length-1;i>=0;i--)if(inPoly(x,y,state.buildings[i].pts))return{k:'buildings',id:state.buildings[i].id};
 for(const k of['walls','roads','rivers'])for(let i=state[k].length-1;i>=0;i--){const o=state[k][i];if(polyDist(x,y,sm(o))<(o.w||o.t)/2+5)return{k,id:o.id}}return null}
function freeSpot(x,y,r){if(x<r||y<r||x>W-r||y>H-r)return false;if(isWater(x,y))return false;for(const v of state.rivers)if(polyDist(x,y,sm(v))<v.w/2+10+r*.5)return false;for(const v of state.roads)if(polyDist(x,y,sm(v))<v.w/2+r*.7)return false;for(const v of state.walls)if(polyDist(x,y,sm(v))<v.t/2+r*.7)return false;for(const b of state.buildings)if(inPoly(x,y,b.pts)||polyDist(x,y,b.pts.concat([b.pts[0]]))<r*.8)return false;for(const s of state.stamps)if(dist(x,y,s.x,s.y)<STAMPS[s.type].r*s.s+r*.7)return false;for(const t of state.trees)if(dist(x,y,t.x,t.y)<(t.r+r)*.72)return false;return true}

const help=document.createElement('dialog');help.id='helpDialog';help.innerHTML=`<button class="closeHelp" autofocus>Закрыть</button><h2>Твоё место приключения.</h2><p>Свободная песочница: строй деревню, город или отдельный дом. Никакой экономики, ресурсов и обязательных задач.</p><div class="helpgrid"><p><b>01 · Нарисуй улицы</b><br>Дорога: <code>D</code>. Проведи несколько улиц и переулков.</p><p><b>02 · Построй квартал</b><br>Квартал: <code>U</code>. Выбери стиль и растяни область рядом с улицами.</p><p><b>03 · Сделай своим</b><br>Выбор: <code>V</code>. Меняй размер, крышу, этажность. Изменённые дома защищены от перегенерации.</p><p><b>04 · Зайди внутрь</b><br>Интерьер: <code>K</code>. Этажи, планировки, мебель и внутренние стены <code>J</code>.</p></div><h3>Управление</h3><p>Пробел + перетаскивание — камера. Колесо — масштаб.<br><code>⌘Z</code> — отмена · <code>⇧⌘Z</code> — повтор · <code>⌘D</code> — копия.<br><code>N</code> — ночь · <code>[</code> / <code>]</code> — поворот объекта на 15°.<br>Привязка к сетке включается в настройках карты.</p><h3>Твои данные</h3><p>Автосохранение работает в этом браузере, если он разрешает локальное хранилище. Для надёжной копии нажми «Сохранить» и скачай JSON. Файл открывается через «Открыть». Облака и аккаунтов нет.</p><p class="muted">Это 2D/2.5D-редактор сверху, не полноценный 3D-движок. PNG и файл проекта работают автономно, без внешних библиотек.</p>`;document.body.append(help);help.querySelector('button').onclick=()=>help.close();help.addEventListener('click',e=>{if(e.target===help&&e.offsetX<0)help.close()});helpButton.onclick=()=>help.showModal();

/* ---------- export ---------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const nowT=()=>(performance.now()-t0)/1000;
function renderTo(scale){const[c,x]=mk(W*scale,H*scale);x.scale(scale,scale);drawWorld(x,nowT(),false);return c}
function exportPng(scale=2){const c=renderTo(scale);c.toBlob(b=>{download('karta.png',b);toast(`PNG выгружен: ${W*scale}×${H*scale}`)})}
function exportVideo(){if(!window.MediaRecorder){toast('Браузер не поддерживает запись видео');return}const sc=.64,[c,x]=mk(W*sc,H*sc);const types=['video/webm;codecs=vp9','video/webm','video/mp4'];const type=types.find(t=>MediaRecorder.isTypeSupported(t));if(!type){toast('Браузер не поддерживает запись видео');return}
 const stream=c.captureStream(30),rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:8e6}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{stream.getTracks().forEach(track=>track.stop());download('karta.'+(type.includes('mp4')?'mp4':'webm'),new Blob(chunks,{type}));toast('Анимация готова')};
 const start=performance.now();rec.start();toast('Записываю анимацию: 6 секунд…');(function step(){const el=(performance.now()-start)/1000;x.setTransform(sc,0,0,sc,0,0);drawWorld(x,el,false);if(el<6)requestAnimationFrame(step);else rec.stop()})()}
function exportVtt(){const g=GRID,pt=([x,y])=>({x:+(x/g).toFixed(3),y:+(y/g).toFixed(3)});const los=[];for(const b of state.buildings)los.push(b.pts.concat([b.pts[0]]).map(pt));for(const w of state.walls)los.push(rdp(sm(w),1.5).map(pt));
 const lights=[];for(const st of state.stamps){const d=STAMPS[st.type];if(d&&d.light)lights.push({position:pt([st.x,st.y]),range:+(d.light[0]*st.s/g).toFixed(2),intensity:1,color:'ff'+d.light[1].split(',').map(v=>(+v).toString(16).padStart(2,'0')).join(''),shadows:true})}
 const img=renderTo(1).toDataURL('image/png').split(',')[1];
 const data={format:0.3,resolution:{map_origin:{x:0,y:0},map_size:{x:W/g,y:H/g},pixels_per_grid:g},line_of_sight:los,objects_line_of_sight:[],portals:[],environment:{baked_lighting:false,ambient_light:state.night>0?'ff1a2550':'ffffffff'},lights,image:img};
 download('karta.dd2vtt',new Blob([JSON.stringify(data)],{type:'application/json'}));toast(`VTT: ${los.length} стен, ${lights.length} источников света`)}
