<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Картограф — редактор живых карт для D&amp;D</title>
<style>
:root{--bg:#F9F8F7;--panel:#FFFFFF;--surface:#F0EFED;--border:#E6E5E3;--text:#2C2C2B;--muted:#7D7A75;--accent:#2783DE;--accent-soft:#E5F2FC;--danger:#E56458;--danger-soft:#FCE9E7}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--panel:#202020;--surface:#383836;--border:rgba(255,255,255,.2);--text:#FFFFFF;--muted:rgba(255,255,255,.65);--accent:#5E9FE8;--accent-soft:rgba(94,159,232,.16);--danger:#E97366;--danger-soft:rgba(233,115,102,.14)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:60px minmax(0,1fr) 264px;grid-template-rows:52px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel);min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0;white-space:nowrap}
.brand b{font-size:16px}
.brand span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer;white-space:nowrap;justify-content:center}
.hbtn:hover{background:var(--surface)}
.hbtn:disabled{opacity:.4;cursor:default}
.hbtn svg{width:18px;height:18px;flex:none}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sep{width:1px;height:24px;background:var(--border);margin:0 2px}
#tools{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto;scrollbar-width:none}
.tool{width:44px;height:44px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none}
.tool:hover{background:var(--surface)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool svg{width:22px;height:22px}
.tgap{width:28px;height:1px;background:var(--border);margin:5px 0;flex:none}
#stage{position:relative;overflow:hidden;background:#7f8d57;min-width:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:12px;bottom:12px;max-width:min(540px,calc(100% - 150px));background:rgba(28,28,26,.84);color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;pointer-events:none}
#hint b{font-weight:600}
#zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
#zoom button{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.94);color:#2C2C2B;cursor:pointer;font-size:16px}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff;color:#2C2C2B;border:1px solid #E6E5E3;box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.06);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#panel{background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;padding:16px}
#panel h3{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
#panel section{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border)}
#panel section:last-child{border-bottom:0;margin-bottom:0}
.ptitle{font-size:15px;font-weight:600;margin:0 0 4px}
.pdesc{color:var(--muted);font-size:13px;margin:0 0 12px}
.field{margin:0 0 12px}
.field>label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.field label output{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text]{width:100%;height:36px;border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:0 10px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:34px;border:0;background:transparent;cursor:pointer;font-size:13px;padding:0 4px}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{min-height:40px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer;font-size:12px;padding:4px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip i{display:block;width:18px;height:18px;border-radius:4px;margin:0 auto 2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.on{border-color:var(--accent)}
.pbtn{width:100%;min-height:36px;border:1px solid var(--border);border-radius:8px;background:var(--panel);cursor:pointer;margin-top:8px}
.pbtn:hover{background:var(--surface)}
.pbtn.danger{color:var(--danger)}
.pbtn.danger:hover{background:var(--danger-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .pbtn{margin-top:0}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;min-height:32px}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.rules{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.rules li{margin-bottom:4px}
.kbd{color:var(--muted);font-size:12px;margin-top:8px}
#panelToggle{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){
 #app{grid-template-columns:56px minmax(0,1fr)}
 #panel{position:absolute;right:0;top:52px;bottom:0;width:min(300px,86vw);z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none}
 #panel.open{display:block}
 #panelToggle{display:inline-flex}
 .hbtn .lbl{display:none}
 .brand span{display:none}
 #tools{width:56px}
}
@media (max-width:480px){.hide-xs{display:none!important}#hint{font-size:12px;max-width:calc(100% - 24px);bottom:56px}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="brand"><b>Картограф</b><span>редактор живых карт для D&amp;D</span></div>
  <button class="hbtn" id="undo" title="Отменить (⌘Z)" aria-label="Отменить"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5L3 9l4 4"/><path d="M3 9h9a4.5 4.5 0 010 9h-2"/></svg></button>
  <button class="hbtn" id="redo" title="Повторить (⇧⌘Z)" aria-label="Повторить"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l4 4-4 4"/><path d="M17 9H8a4.5 4.5 0 000 9h2"/></svg></button>
  <span class="sep"></span>
  <button class="hbtn" id="nightBtn" title="День / ночь (N)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 12.5A6.5 6.5 0 017.5 4a6.5 6.5 0 108.5 8.5z"/></svg><span class="lbl">Ночь</span></button>
  <button class="hbtn hide-xs" id="saveJson" title="Сохранить карту в файл"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg><span class="lbl">Сохранить</span></button>
  <button class="hbtn hide-xs" id="loadJson" title="Открыть карту из файла"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14V4M6 8l4-4 4 4M4 16h12"/></svg><span class="lbl">Открыть</span></button>
  <button class="hbtn primary" id="exportPng" title="Выгрузить PNG"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 13l4-4 3 3 2-2 5 5"/></svg><span class="lbl">PNG</span></button>
  <button class="hbtn" id="panelToggle" aria-label="Параметры"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
 </header>
 <nav id="tools" aria-label="Инструменты"></nav>
 <main id="stage">
  <canvas id="map" aria-label="Холст карты"></canvas>
  <div id="toast" role="status"></div>
  <div id="hint"></div>
  <div id="zoom"><button id="zOut" aria-label="Отдалить">−</button><button id="zFit" aria-label="Показать всю карту" title="Вся карта"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg></button><button id="zIn" aria-label="Приблизить">+</button></div>
 </main>
 <aside id="panel" aria-label="Параметры"></aside>
</div>
<script>
